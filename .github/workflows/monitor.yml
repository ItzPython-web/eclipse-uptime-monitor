name: Eclipse external uptime

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VPS and chat
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_OWNER_ID: ${{ secrets.DISCORD_OWNER_ID }}
        run: python3 monitor.py
      - name: Save monitor state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "Eclipse Monitor"
            git config user.email "monitor@users.noreply.github.com"
            git add state.json
            git commit -m "Update uptime state"
            git push
          fi
